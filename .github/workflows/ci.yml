name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
        deps: [current]
        include:
          # Every direct dependency at the lowest version pyproject.toml allows.
          - python-version: "3.11"
            deps: minimum
    steps:
      - uses: actions/checkout@v4
      # The uml launcher is a zsh script (issue #9), and a test runs it.
      - run: sudo apt-get update && sudo apt-get install -y zsh
      # A test reads .metrics/crap.edn back with babashka, as uml-viewer's Clojure would.
      - run: curl -sSfL https://raw.githubusercontent.com/babashka/babashka/master/install | sudo bash
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - if: matrix.deps == 'current'
        run: pip install -e ".[dev]"
      - if: matrix.deps == 'minimum'
        run: pip install uv && uv pip install --system --resolution lowest-direct -e ".[dev]"
      - run: python -m pytest -q
